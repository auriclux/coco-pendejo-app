<!DOCTYPE html>

<title>Ask a Customer</title>
<script>
(function () {
  try {
    var s = localStorage.getItem('oo_skin');
    if (!s) {
      var d = new Date();
      if (d.getMonth() === 11 && d.getDate() >= 23 && d.getDate() <= 26) s = 'navidad';
    }
    if (s) document.documentElement.setAttribute('data-skin', s);
  } catch (e) {}
})();
</script>
<style>

    --accent-ink: #000000;

    --danger-soft: rgba(255, 23, 68, 0.12);
    --danger-line: rgba(255, 23, 68, 0.3);
    --danger-glow: rgba(229, 57, 53, 0.4);
    --scrim: rgba(0, 0, 0, 0.85);

  }
  :root[data-skin="papel"] {
    --bg: #f3ecd9;
    --card-bg: #fffdf4;
    --surface2: #efe6cf;

    --archive-color: #0277bd;

    --danger-soft: rgba(193, 18, 31, 0.10);

    --scrim: rgba(42, 33, 24, 0.55);

  }
  :root[data-skin="primer"] {
    --bg: #d7dee4;
    --card-bg: #eef2f5;
    --surface2: #dde5eb;
    --text: #1d2a33;
    --on-accent: #ffffff;
    --accent: #0e7a3d;
    --brand: #1f7a3d;
    --warn: #b25e00;
    --danger: #c1121f;
    --subtext: #54666f;
    --archive-color: #0277bd;
    --line: #b4c2cc;
    --line2: #97a9b5;
    --track: #c3d0d9;
    --accent-ink: #ffffff;
    --archive-soft: rgba(2, 119, 189, 0.12);
    --archive-line: rgba(2, 119, 189, 0.45);
    --danger-soft: rgba(193, 18, 31, 0.10);
    --danger-line: rgba(193, 18, 31, 0.35);
    --danger-glow: rgba(193, 18, 31, 0.35);
    --scrim: rgba(29, 42, 51, 0.55);
    --shadow: rgba(29, 42, 51, 0.25);
    --dim: #3c4c56;
    --ok-soft: #e2f2e6;
    --warn-soft: #fdf0d5;

    --card-shadow: rgba(29, 42, 51, 0.10);
  }
  :root[data-skin="navidad"] {
    --bg: #12241a;
    --card-bg: #1a3324;
    --surface2: #234531;
    --text: #f5eedd;
    --on-accent: #ffffff;
    --accent: #ffd54a;
    --brand: #a31621;
    --warn: #ffb74d;
    --danger: #ff6f60;
    --subtext: #b9c9a8;
    --archive-color: #7fd4ff;
    --line: #2c5238;
    --line2: #3a6a49;
    --track: #1f4230;
    --accent-ink: #201600;
    --archive-soft: rgba(127, 212, 255, 0.15);
    --archive-line: rgba(127, 212, 255, 0.4);
    --danger-soft: rgba(255, 111, 96, 0.14);
    --danger-line: rgba(255, 111, 96, 0.4);
    --danger-glow: rgba(255, 111, 96, 0.4);
    --scrim: rgba(0, 0, 0, 0.8);
    --shadow: rgba(0, 0, 0, 0.6);
    --dim: #d8cfb8;
    --ok-soft: rgba(255, 213, 74, 0.15);
    --warn-soft: rgba(255, 183, 77, 0.15);
    --warn-line: rgba(255, 183, 77, 0.55);
    --card-shadow: rgba(0, 0, 0, 0.45);
  }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 2px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); margin: 22px 0 6px; }
  .card { background: var(--card-bg); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; box-shadow: 0 1px 3px var(--card-shadow); }
  label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 4px; }
  select, input[type="url"], textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card-bg); }
  textarea { margin-top: 0; }
  .kinds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .kinds button { font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-bg); color: var(--text); cursor: pointer; }
  .kinds button.active { background: var(--brand); border-color: var(--brand); color: var(--on-accent); font-weight: 600; }
  button.send { margin-top: 14px; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-accent); font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: 0.5; }
  button.speak { margin-top: 8px; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--brand); background: var(--card-bg); color: var(--brand); font-weight: 600; cursor: pointer; margin-right: 8px; }
  .note { color: var(--subtext); font-size: 14px; margin: 8px 0 0; }
  .banner { background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin: 0 0 14px; display: none; }
  .who { font-size: 16px; font-weight: 700; margin: 0; }
  .car { color: var(--dim); font-size: 14px; margin: 2px 0 0; }
  .wait { color: var(--danger); font-size: 13px; font-weight: 700; margin: 6px 0 0; }
  .body { font-size: 15px; margin: 8px 0 0; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .refresh { font-size: 14px; color: var(--brand); background: none; border: none; cursor: pointer; font-weight: 600; padding: 0; }
  .backline a { color: var(--brand); font-weight: 600; text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<main id="app"> 
<p class="backline"><a href="index.html">← Back to the board</a></p>
<div class="topbar">
    <h1>Ask a Customer</h1>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>
  <div class="banner" id="banner"></div>
  <div id="form"><p class="note">Loading...</p></div>
  <h2>Waiting for answers</h2>
  <div id="open"><p class="note">Loading...</p></div>
</main>
<script>
"use strict";

var SUPABASE_URL = "https://lnyfpelahepvwlfwppgj.supabase.co";
var PUBLISHABLE_KEY = "sb_publishable_yEcdzGdtwcZr4XJm5qSdrw_XDgtezjP";

function actorId() {
  var fromUrl = new URLSearchParams(window.location.search).get("a");
  if (fromUrl) {
    try { localStorage.setItem("oo_actor", fromUrl); } catch (e) {}
    return fromUrl;
  }
  try { return localStorage.getItem("oo_actor"); } catch (e) { return null; }
}

var ACTOR = actorId();
var DIRECTORY = null;
var KIND = "buy";

function el(tag, text, cls) {
  var n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function rpc(name, body) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  }).then(function (resp) {
    return resp.ok ? resp.json() : null;
  }).catch(function () { return null; });
}

function waiting(created) {
  var mins = Math.floor((Date.now() - new Date(created).getTime()) / 60000);
  if (mins < 1) return "Just sent";
  if (mins < 60) return "Waiting " + mins + (mins === 1 ? " minute" : " minutes");
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return "Waiting " + hrs + (hrs === 1 ? " hour" : " hours");
  var days = Math.floor(hrs / 24);
  return "Waiting " + days + (days === 1 ? " day" : " days");
}

function showBanner(text) {
  var b = document.getElementById("banner");
  b.textContent = text;
  b.style.display = "block";
}

var KIND_LABEL = { buy: "Part purchase", visit: "Come in", note: "Message" };

function buildForm() {
  var host = document.getElementById("form");
  host.innerHTML = "";
  var card = el("div", null, "card");

  var custSel = el("select");
  DIRECTORY.customers.forEach(function (c) {
    var o = el("option", c.name);
    o.value = c.id;
    custSel.appendChild(o);
  });
  var carSel = el("select");

  function fillCars() {
    carSel.innerHTML = "";
    var cust = DIRECTORY.customers.filter(function (c) {
      return c.id === custSel.value;
    })[0];
    (cust ? cust.episodes : []).forEach(function (e) {
      var label = e.car_name + " · " + e.job_title +
        (e.state === "staged" ? " (staged)" : "");
      var o = el("option", label);
      o.value = e.id;
      carSel.appendChild(o);
    });
  }
  custSel.addEventListener("change", fillCars);

  card.appendChild(el("label", "Customer"));
  card.appendChild(custSel);
  card.appendChild(el("label", "Car and job"));
  card.appendChild(carSel);

  card.appendChild(el("label", "What are you asking?"));
  var kinds = el("div", null, "kinds");
  var kindBtns = {};
  [["buy", "Ask to buy a part"], ["visit", "Ask to come in"],
   ["note", "Send a message"]].forEach(function (pair) {
    var b = el("button", pair[1]);
    b.type = "button";
    if (pair[0] === KIND) b.className = "active";
    b.addEventListener("click", function () {
      KIND = pair[0];
      Object.keys(kindBtns).forEach(function (k) {
        kindBtns[k].classList.toggle("active", k === KIND);
      });
      syncFields();
    });
    kindBtns[pair[0]] = b;
    kinds.appendChild(b);
  });
  card.appendChild(kinds);

  var linkWrap = el("div");
  linkWrap.appendChild(el("label", "Part link (paste it here)"));
  var linkIn = el("input");
  linkIn.type = "url";
  linkIn.placeholder = "https://...";
  linkWrap.appendChild(linkIn);
  var buyNote = el("p",
    "The customer pays the seller directly and has it shipped to the shop.",
    "note");
  linkWrap.appendChild(buyNote);
  card.appendChild(linkWrap);

  var msgLabel = el("label", "Comment (optional)");
  card.appendChild(msgLabel);
  var ta = el("textarea");
  ta.rows = 3;
  card.appendChild(ta);
  var note = el("p", "", "note");

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = el("button", "🎤 Speak", "speak");
    var recog = new SR();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true;
    var listening = false;
    var baseText = "";
    mic.addEventListener("click", function () {
      if (listening) { recog.stop(); return; }
      baseText = ta.value.trim();
      if (baseText) baseText += " ";
      recog.start();
    });
    recog.addEventListener("start", function () {
      listening = true;
      mic.textContent = "⏹ Stop";
      note.textContent = "Listening... speak now.";
    });
    recog.addEventListener("result", function (ev) {
      var txt = "";
      for (var i = 0; i < ev.results.length; i++) {
        txt += ev.results[i][0].transcript;
      }
      ta.value = baseText + txt;
    });
    recog.addEventListener("end", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      if (note.textContent.indexOf("Listening") === 0) note.textContent = "";
    });
    recog.addEventListener("error", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      note.textContent = "The microphone did not work here. You can type instead.";
    });
    card.appendChild(mic);
  }

  var send = el("button", "Send", "send");
  send.addEventListener("click", function () {
    var payload = {};
    var text = ta.value.trim();
    if (KIND === "buy") {
      var link = linkIn.value.trim();
      if (!link) {
        note.textContent = "Paste the part link first.";
        return;
      }
      payload.link = link;
      if (text) payload.text = text;
    } else {
      if (!text) {
        note.textContent = "Write or speak the message first.";
        return;
      }
      payload.text = text;
    }
    if (!carSel.value) {
      note.textContent = "Pick a car first.";
      return;
    }
    send.disabled = true;
    note.textContent = "Sending...";
    rpc("shop_send_request", {
      p_actor_id: ACTOR,
      p_episode_id: carSel.value,
      p_kind: KIND,
      p_payload: payload
    }).then(function (id) {
      send.disabled = false;
      if (id) {
        var custName = custSel.options[custSel.selectedIndex].textContent;
        showBanner("Request sent to " + custName + ".");
        linkIn.value = "";
        ta.value = "";
        note.textContent = "";
        loadOpen();
      } else {
        note.textContent = "That did not go through. Please try again.";
      }
    });
  });
  card.appendChild(send);
  card.appendChild(note);
  host.appendChild(card);
  fillCars();

  function syncFields() {
    linkWrap.style.display = KIND === "buy" ? "" : "none";
    msgLabel.textContent = KIND === "buy" ? "Comment (optional)" : "Message";
    if (KIND === "visit" && !ta.value.trim()) {
      ta.value = "Can you come in to look at ";
    }
  }
  syncFields();
}

function renderOpen() {
  var host = document.getElementById("open");
  host.innerHTML = "";
  host.appendChild(el("p", "Loading...", "note"));
  rpc("shop_outbound_open", { p_actor_id: ACTOR }).then(function (data) {
    host.innerHTML = "";
    if (!data || !data.requests) {
      host.appendChild(el("p",
        "That shop key was not accepted. Open this page from the shop link.", "note"));
      return;
    }
    if (data.requests.length === 0) {
      host.appendChild(el("p", "Nothing waiting. Every request has its answer.", "note"));
      return;
    }
    data.requests.forEach(function (r) {
      var card = el("div", null, "card");
      card.appendChild(el("p", r.customer_name || "Customer", "who"));
      var carLine = r.car_name
        ? (r.job_title ? r.car_name + " · " + r.job_title : r.car_name)
        : "";
      card.appendChild(el("p", carLine, "car"));
      card.appendChild(el("p",
        (KIND_LABEL[r.kind] || r.kind) + " · " + waiting(r.created_at), "wait"));
      var p = r.payload || {};
      if (p.text) card.appendChild(el("p", p.text, "body"));
      if (p.link) {
        var lp = el("p", null, "body");
        var a = el("a", p.link);
        if (/^https?:\/\//i.test(p.link)) a.href = p.link;
        a.target = "_blank";
        a.rel = "noopener";
        lp.appendChild(a);
        card.appendChild(lp);
      }
      host.appendChild(card);
    });
  });
}

function loadOpen() { renderOpen(); }

function load() {
  rpc("shop_directory", { p_actor_id: ACTOR }).then(function (data) {
    var host = document.getElementById("form");
    if (!data || !data.customers) {
      host.innerHTML = "";
      host.appendChild(el("p",
        "That shop key was not accepted. Open this page from the shop link.", "note"));
      document.getElementById("open").innerHTML = "";
      return;
    }
    DIRECTORY = data;
    buildForm();
    renderOpen();
  });
}

document.getElementById("refreshBtn").addEventListener("click", function () {
  load();
});

if (!ACTOR) {
  document.getElementById("form").innerHTML = "";
  document.getElementById("form").appendChild(el("p",
    "This page needs the shop link. Ask for the link with your key in it.", "note"));
  document.getElementById("open").innerHTML = "";
} else {
  load();
}
</script>
</body>
</html>
