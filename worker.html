<!DOCTYPE html>

<title>Jobs &amp; Hours — Double-O Garage</title>
<script>
(function () {
  try {
    var s = localStorage.getItem('oo_skin');
    if (!s) {
      var d = new Date();
      if (d.getMonth() === 11 && d.getDate() >= 23 && d.getDate() <= 26) s = 'navidad';
    }
    if (s) document.documentElement.setAttribute('data-skin', s);
  } catch (e) {}
})();
</script>

  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .back { display: inline-block; margin-bottom: 10px; color: var(--brand); text-decoration: none; font-size: 15px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .who { color: var(--subtext); font-size: 14px; margin-bottom: 14px; }
  h2 { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--subtext); margin: 22px 0 8px; }
  .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; box-shadow: 0 1px 3px var(--card-shadow); }
  .car { font-size: 16px; font-weight: 600; }
  .job { color: var(--dim); font-size: 14px; margin-top: 1px; }
  .head { font-size: 15px; margin-top: 6px; }
  .prog { font-size: 14px; color: var(--dim); margin-top: 2px; }
  .target { font-size: 13px; color: var(--subtext); margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; }
  .tag.staged { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
  .dayhead { font-size: 15px; font-weight: 600; margin: 16px 0 6px; }
  .dayhead .total { color: var(--subtext); font-weight: 400; font-size: 13px; }
  .entry { display: flex; align-items: baseline; gap: 8px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin: 0 0 6px; }
  .entry.mine { cursor: pointer; }
  .entry .ecar { flex: 1; font-size: 15px; }
  .entry .enote { display: block; font-size: 13px; color: var(--dim); }
  .entry .ewho { display: block; font-size: 12px; color: var(--subtext); }
  .entry .ehrs { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .entry .eedit { font-size: 13px; color: var(--brand); white-space: nowrap; }
  .none { color: var(--subtext); font-size: 14px; margin: 0 0 6px; }
  label { display: block; font-size: 13px; color: var(--subtext); margin: 10px 0 4px; }
  input, select { width: 100%; font-size: 16px; padding: 9px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card-bg); color: var(--text); }
  .saverow { display: flex; gap: 8px; margin-top: 14px; }
  .save { flex: 1; font-size: 16px; font-weight: 600; padding: 11px; border: 1px solid var(--brand); border-radius: 8px; background: var(--brand); color: var(--on-accent); cursor: pointer; }

  textarea { width: 100%; font-size: 16px; padding: 9px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card-bg); color: var(--text); font-family: inherit; }

</style>
</head>
<body>
<main id="app">
<a class="back" href="index.html">← Shop board</a>
<h1>Jobs &amp; Hours</h1>
<div class="who" id="who"></div>

<div class="card">
  <label for="ctx" style="margin-top:0">Working on</label>
  <select id="ctx"></select>
</div>

<h2>Cars in the shop</h2>
<div id="jobs"></div>

<h2>Add or fix hours</h2>
<div class="card" id="formcard">
  <label for="f-date">Day</label>
  <input type="date" id="f-date">
  <label for="f-hours">Hours (your best estimate)</label>
  <input type="number" id="f-hours" inputmode="decimal" step="0.25" min="0" max="24" placeholder="e.g. 3.5">
  <label for="f-note">Note (optional)</label>
  <input type="text" id="f-note" placeholder="What you worked on">
  <div class="saverow">
    <button type="button" class="save" id="save">Save hours</button>
    <button type="button" class="clear" id="clear">Clear</button>
  </div>
  <div class="formnote" id="formnote"></div>
</div>

<h2>Tell Omar</h2>
<div class="card" id="notecard">
  <label for="n-body">What you did, what you found, what changed</label>
  <textarea id="n-body" rows="3" placeholder="Say it or type it"></textarea>
  <div class="saverow">
    <button type="button" class="save" id="post">Post note</button>
  </div>
  <div class="formnote" id="notenote"></div>
</div>

<h2>Shop notes</h2>
<div id="notes"></div>

<h2 id="entries-title">Hours</h2>
<div class="none" id="hours-total"></div>
<div id="entries"></div>
</main>
<script>
"use strict";

var SUPABASE_URL = "https://lnyfpelahepvwlfwppgj.supabase.co";
var PUBLISHABLE_KEY = "sb_publishable_yEcdzGdtwcZr4XJm5qSdrw_XDgtezjP";

var MONTHS = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];
var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function actorId() {
  var fromUrl = new URLSearchParams(window.location.search).get("a");
  if (fromUrl) {
    try { localStorage.setItem("oo_actor", fromUrl); } catch (e) {}
    return fromUrl;
  }
  try { return localStorage.getItem("oo_actor"); } catch (e) { return null; }
}

var ACTOR = actorId();

function el(tag, text, cls) {
  var n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function rpc(name, body) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  }).then(function (resp) {
    return resp.ok ? resp.json() : null;
  }).catch(function () { return null; });
}

function pad(n) { return (n < 10 ? "0" : "") + n; }

function isoOf(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function addDays(iso, n) {
  var p = iso.split("-");
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + n);
  return isoOf(d);
}

function fmtDate(iso) {
  if (!iso) return "";
  var p = String(iso).split("-");
  var y = parseInt(p[0], 10), m = parseInt(p[1], 10), d = parseInt(p[2], 10);
  if (!y || !m || !d) return String(iso);
  return MONTHS[m - 1] + " " + d + ", " + y;
}

function fmtDay(iso) {
  var p = String(iso).split("-");
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  return WEEKDAYS[d.getDay()] + ", " + fmtDate(iso);
}

function fmtHours(h) {
  var v = Math.round(parseFloat(h) * 100) / 100;
  return String(v);
}

var TODAY = isoOf(new Date());
var FROM = addDays(TODAY, -89);
var JOBS = [];
var ENTRIES = [];
var SEEALL = false;

function jobById(id) {
  for (var i = 0; i < JOBS.length; i++) if (JOBS[i].episodeId === id) return JOBS[i];
  return null;
}

function renderJobs() {
  var wrap = document.getElementById("jobs");
  wrap.textContent = "";
  var v = ctxValue();
  if (v === "") {
    var c0 = el("div", null, "card");
    c0.appendChild(el("div", "Shop work", "car"));
    c0.appendChild(el("div", "Work that belongs to no car in particular.", "job"));
    wrap.appendChild(c0);
    return;
  }
  var j = jobById(v);
  if (!j) {
    wrap.appendChild(el("p", "That job is not in the shop anymore.", "none"));
    return;
  }
  var card = el("div", null, "card");
  var carLine = el("div", null, "car");
  carLine.appendChild(document.createTextNode(j.carName));
  if (j.state === "staged") carLine.appendChild(el("span", "Staged", "tag staged"));
  card.appendChild(carLine);
  card.appendChild(el("div", j.episodeTitle, "job"));
  if (j.headline) card.appendChild(el("div", j.headline, "head"));
  if (j.inProgress && j.inProgress.length) {
    card.appendChild(el("div", "In progress: " + j.inProgress.join(", "), "prog"));
  }
  if (j.state === "staged" && j.agreedCondition) {
    card.appendChild(el("div", "Starts: " + j.agreedCondition, "target"));
  }
  if (j.blessedDoneDate) {
    card.appendChild(el("div", "Target: " + fmtDate(j.blessedDoneDate), "target"));
  }
  wrap.appendChild(card);
}

function ctxValue() {
  return document.getElementById("ctx").value;
}

function ctxEpisode() {
  var v = ctxValue();
  return v === "" ? null : v;
}

function ctxLabel() {
  var v = ctxValue();
  if (v === "") return "Shop work";
  var j = jobById(v);
  return j ? j.carName + " — " + j.episodeTitle : "Shop work";
}

function fillContext() {
  var sel = document.getElementById("ctx");
  sel.textContent = "";
  var o = document.createElement("option");
  o.value = "";
  o.textContent = "Shop work";
  sel.appendChild(o);
  JOBS.forEach(function (j) {
    var opt = document.createElement("option");
    opt.value = j.episodeId;
    opt.textContent = j.carName + " — " + j.episodeTitle;
    sel.appendChild(opt);
  });
}

function renderEntries() {
  document.getElementById("entries-title").textContent = "Hours on " + ctxLabel();
  var wrap = document.getElementById("entries");
  wrap.textContent = "";
  var v = ctxValue();
  var rows = ENTRIES.filter(function (e) { return (e.episodeId || "") === v; });
  var total = 0;
  rows.forEach(function (e) { total += parseFloat(e.hours); });
  document.getElementById("hours-total").textContent = rows.length
    ? "Total here: " + fmtHours(total) + " hrs over " + rows.length + (rows.length === 1 ? " day." : " days.")
    : "";
  if (!rows.length) {
    wrap.appendChild(el("p", "No hours logged here yet.", "none"));
    return;
  }
  rows.slice().reverse().forEach(function (e) {
    var mine = e.actorId === ACTOR;
    var row = el("div", null, "entry" + (mine ? " mine" : ""));
    var left = el("div", null, "ecar");
    left.appendChild(document.createTextNode(fmtDay(e.workDate)));
    if (!mine && SEEALL) left.appendChild(el("span", e.actorName, "ewho"));
    if (e.note) left.appendChild(el("span", e.note, "enote"));
    row.appendChild(left);
    row.appendChild(el("span", fmtHours(e.hours) + " hrs", "ehrs"));
    if (mine) {
      row.appendChild(el("span", "Edit", "eedit"));
      row.addEventListener("click", function () { editEntry(e); });
    }
    wrap.appendChild(row);
  });
}

function setFormNote(text, ok) {
  var n = document.getElementById("formnote");
  n.textContent = text || "";
  n.className = "formnote" + (ok ? " ok" : "");
}

function editEntry(e) {
  document.getElementById("f-date").value = e.workDate;
  document.getElementById("f-hours").value = fmtHours(e.hours);
  document.getElementById("f-note").value = e.note || "";
  setFormNote("Editing your " + fmtDate(e.workDate) + " entry on " + ctxLabel() + ". Save updates it.", false);
  document.getElementById("formcard").scrollIntoView({ behavior: "smooth", block: "start" });
}

function clearForm() {
  document.getElementById("f-date").value = TODAY;
  document.getElementById("f-hours").value = "";
  document.getElementById("f-note").value = "";
  setFormNote("", false);
}

function loadHours() {
  return rpc("shop_hours_open", { p_actor_id: ACTOR, p_from: FROM, p_to: TODAY }).then(function (res) {
    if (res) {
      ENTRIES = res.hours || [];
      SEEALL = !!res.canSeeAll;
      document.getElementById("who").textContent = SEEALL
        ? "You see everyone's hours and notes for the selected job. Entries you add are under your own name."
        : "Pick what you are working on above. Your hours and notes below follow it.";
    }
    renderEntries();
  });
}

function save() {
  var date = document.getElementById("f-date").value;
  var job = ctxEpisode();
  var hours = parseFloat(document.getElementById("f-hours").value);
  var note = document.getElementById("f-note").value.trim();
  if (!date) { setFormNote("Pick the day you worked.", false); return; }
  if (!hours || hours <= 0 || hours > 24) { setFormNote("Hours must be more than 0 and no more than 24.", false); return; }
  rpc("shop_hours_set", {
    p_actor_id: ACTOR,
    p_episode_id: job,
    p_work_date: date,
    p_hours: hours,
    p_note: note || null
  }).then(function (row) {
    if (!row) { setFormNote("That did not save. Try again.", false); return; }
    setFormNote("✓ Saved: " + fmtHours(row.hours) + " hrs on " + ctxLabel() + ", " + fmtDate(row.workDate) + ".", true);
    document.getElementById("f-hours").value = "";
    document.getElementById("f-note").value = "";
    loadHours();
  });
}


function addSpeak(card, input, note) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  var mic = el("button", "🎤 Speak", "speak");
  var recog = new SR();
  recog.lang = navigator.language || "en-US";
  recog.interimResults = true;
  var listening = false;
  var baseText = "";
  mic.addEventListener("click", function () {
    if (listening) { recog.stop(); return; }
    baseText = input.value.trim();
    if (baseText) baseText += " ";
    recog.start();
  });
  recog.addEventListener("start", function () {
    listening = true;
    mic.textContent = "⏹ Stop";
    note.textContent = "Listening... speak now.";
  });
  recog.addEventListener("result", function (ev) {
    var txt = "";
    for (var i = 0; i < ev.results.length; i++) {
      txt += ev.results[i][0].transcript;
    }
    input.value = baseText + txt;
  });
  recog.addEventListener("end", function () {
    listening = false;
    mic.textContent = "🎤 Speak";
    if (note.textContent.indexOf("Listening") === 0) note.textContent = "";
  });
  recog.addEventListener("error", function () {
    listening = false;
    mic.textContent = "🎤 Speak";
    note.textContent = "The microphone did not work here. You can type instead.";
  });
  card.appendChild(mic);
}

var NOTES = [];

function fmtStamp(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  var h = d.getHours();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + h + ":" + pad(d.getMinutes()) + " " + ampm;
}

function renderNotes() {
  var wrap = document.getElementById("notes");
  wrap.textContent = "";
  var v = ctxValue();
  var shown = NOTES.filter(function (n) { return (n.episodeId || "") === v; });
  if (!shown.length) {
    wrap.appendChild(el("p", "No notes on this one yet.", "none"));
    return;
  }
  shown.forEach(function (n) {
    var card = el("div", null, "card");
    card.appendChild(el("div", n.carName + " — " + n.episodeTitle, "car"));
    card.appendChild(el("div", n.body, "nbody"));
    var meta = fmtStamp(n.createdAt);
    if (n.actorId !== ACTOR) meta = n.actorName + " · " + meta;
    card.appendChild(el("div", meta, "nmeta"));
    wrap.appendChild(card);
  });
}

function loadNotes() {
  return rpc("shop_notes_open", { p_actor_id: ACTOR, p_limit: 50 }).then(function (res) {
    if (res) NOTES = res.notes || [];
    renderNotes();
  });
}

function postNote() {
  var note = document.getElementById("notenote");
  var job = ctxEpisode();
  var body = document.getElementById("n-body").value.trim();
  if (!body) { note.textContent = "Say or type the note first."; note.className = "formnote"; return; }
  rpc("shop_note_add", { p_actor_id: ACTOR, p_episode_id: job, p_body: body }).then(function (row) {
    if (!row) { note.textContent = "That did not post. Try again."; note.className = "formnote"; return; }
    note.textContent = "✓ Posted on " + ctxLabel() + ". It's in the notes below, with your name and the time on it.";
    note.className = "formnote ok";
    document.getElementById("n-body").value = "";
    loadNotes();
  });
}

function init() {
  var app = document.getElementById("app");
  if (!ACTOR) {
    app.appendChild(el("div", "This page needs your shop link. Open it from the board on the shop phone.", "message"));
    return;
  }
  document.getElementById("f-date").value = TODAY;
  document.getElementById("f-date").max = addDays(TODAY, 1);
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("clear").addEventListener("click", clearForm);
  document.getElementById("post").addEventListener("click", postNote);
  document.getElementById("ctx").addEventListener("change", function () { renderJobs(); renderEntries(); renderNotes(); });
  addSpeak(document.getElementById("notecard"), document.getElementById("n-body"), document.getElementById("notenote"));
  rpc("shop_jobs_overview", { p_actor_id: ACTOR }).then(function (res) {
    if (res) { JOBS = res.jobs || []; }
    fillContext();
    renderJobs();
  });
  loadHours();
  loadNotes();
}

init();

</script>
</body>
</html>
