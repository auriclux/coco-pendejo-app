<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your car — current status</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; line-height: 1.5; color: #1c1c1c; background: #fafafa; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 2px; }
.sub { color: #666; font-size: 14px; margin: 0 0 16px; }
.switcher { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.switcher button { font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid #999; background: #fff; color: #1c1c1c; cursor: pointer; }
.switcher button.active { background: #1f7a3d; border-color: #1f7a3d; color: #fff; font-weight: 600; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 18px; }
.car { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
.job { color: #444; margin: 0 0 4px; }
.asof { color: #c1121f; font-size: 14px; font-weight: 700; margin: 0 0 12px; }
.headline { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
.eta { font-size: 15px; margin: 0 0 2px; }
.eta b { font-weight: 700; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #555; margin: 16px 0 4px; }
ul { margin: 0; padding-left: 20px; }
li { margin: 2px 0; }
.nextlast { font-size: 15px; margin: 0; }
.storydate { color: #666; font-size: 13px; margin: 10px 0 0; }
.storytext { font-size: 15px; margin: 0 0 2px; }
.ask textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px; border: 1px solid #999; border-radius: 8px; }
.ask button { margin-top: 8px; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid #1f7a3d; background: #1f7a3d; color: #fff; font-weight: 600; cursor: pointer; }
.ask button:disabled { opacity: 0.5; }
.ask button.speak { background: #fff; color: #1f7a3d; margin-right: 8px; }
.asknote { color: #666; font-size: 14px; margin: 8px 0 0; }
.cwho { font-size: 13px; color: #666; margin: 10px 0 0; }
.cwho b { color: #1c1c1c; }
.ctext { font-size: 15px; margin: 0 0 2px; }
.cwait { color: #666; font-size: 14px; font-style: italic; margin: 2px 0 0; }
.agree { display: inline-block; background: #e6f4ea; color: #1f7a3d; border: 1px solid #1f7a3d; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; margin-left: 6px; }
.convobtn { margin-top: 10px; font-size: 14px; padding: 7px 14px; border-radius: 999px; border: 1px solid #1f7a3d; background: #fff; color: #1f7a3d; font-weight: 600; cursor: pointer; }
.rrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.rrow button { font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid #1f7a3d; background: #fff; color: #1f7a3d; font-weight: 600; cursor: pointer; }
.rrow button.primary { background: #1f7a3d; color: #fff; }
.rrow button:disabled { opacity: 0.5; }
.rlink { font-size: 15px; margin: 8px 0 0; }
.rdone { font-size: 15px; font-weight: 600; margin: 10px 0 0; }
.endbox { border-radius: 10px; padding: 10px 12px; margin: 12px 0 0; font-size: 15px; font-weight: 600; background: #e6f4ea; }
.endbox.paused { background: #fdf3e0; }
.endbox p { margin: 0; }
.endbox .enddate { font-weight: 400; font-size: 14px; margin-top: 2px; }
.note { color: #666; font-size: 14px; }
.message { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px 18px; font-size: 16px; }
</style>
</head>
<body>
<main id="app">
  <p class="note">Loading your car's status...</p>
</main>

<script>
"use strict";

// The publishable key is designed to live in browser apps; it
// grants nothing by itself because every table is default-deny
// and the only door is the token function called below.
var SUPABASE_URL = "https://lnyfpelahepvwlfwppgj.supabase.co";
var PUBLISHABLE_KEY = "sb_publishable_yEcdzGdtwcZr4XJm5qSdrw_XDgtezjP";

var app = document.getElementById("app");

function el(tag, text, cls) {
  var n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

// "2026-11-20" -> "November 20, 2026", parsed by hand so no
// timezone conversion can shift the day.
function prettyDate(iso) {
  if (!iso) return null;
  var parts = String(iso).split("-");
  if (parts.length !== 3) return String(iso);
  var months = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
  var m = parseInt(parts[1], 10);
  var d = parseInt(parts[2], 10);
  if (m < 1 || m > 12 || isNaN(d)) return String(iso);
  return months[m - 1] + " " + d + ", " + parts[0];
}

function messagePage(text) {
  app.innerHTML = "";
  var box = el("div", null, "message");
  box.appendChild(el("p", text));
  app.appendChild(box);
}

function listSection(parent, title, items) {
  if (!items || items.length === 0) return;
  parent.appendChild(el("h2", title));
  var ul = el("ul");
  items.forEach(function (item) { ul.appendChild(el("li", String(item))); });
  parent.appendChild(ul);
}

function askSection(parent, entry) {
  parent.appendChild(el("h2", "Tell Omar"));
  var box = el("div", null, "ask");
  var ta = el("textarea");
  ta.rows = 3;
  ta.placeholder = "Ask a question about this car...";
  var btn = el("button", "Send");
  var note = el("p", "", "asknote");
  btn.addEventListener("click", function () {
    var text = ta.value.trim();
    if (!text) {
      note.textContent = "Write a message first.";
      return;
    }
    btn.disabled = true;
    note.textContent = "Sending...";
    fetch(SUPABASE_URL + "/rest/v1/rpc/customer_submit", {
      method: "POST",
      headers: {
        "apikey": PUBLISHABLE_KEY,
        "Authorization": "Bearer " + PUBLISHABLE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        p_token: token,
        p_episode_id: entry.episodeId,
        p_kind: "question",
        p_payload: { text: text }
      })
    }).then(function (resp) {
      return resp.ok ? resp.json() : null;
    }).then(function (id) {
  if (id) {
  ta.value = "";
  btn.disabled = false;
  note.textContent =
    "Sent. Your message is on its way to the shop.";
  if (typeof refreshThread === "function") refreshThread();
} else {
        btn.disabled = false;
        note.textContent = "That did not go through. Please try again.";
      }
    }).catch(function () {
      btn.disabled = false;
      note.textContent = "That did not go through. Please try again.";
    });
  });
  box.appendChild(ta);
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = el("button", "🎤 Speak", "speak");
    var recog = new SR();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true;
    var listening = false;
    var baseText = "";
    mic.addEventListener("click", function () {
      if (listening) { recog.stop(); return; }
      baseText = ta.value.trim();
      if (baseText) baseText += " ";
      recog.start();
    });
    recog.addEventListener("start", function () {
      listening = true;
      mic.textContent = "⏹ Stop";
      note.textContent = "Listening... speak now.";
    });
    recog.addEventListener("result", function (ev) {
      var txt = "";
      for (var i = 0; i < ev.results.length; i++) {
        txt += ev.results[i][0].transcript;
      }
      ta.value = baseText + txt;
    });
    recog.addEventListener("end", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      if (note.textContent.indexOf("Listening") === 0) note.textContent = "";
    });
    recog.addEventListener("error", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      note.textContent = "The microphone did not work here. You can type instead.";
    });
    box.appendChild(mic);
  }
  box.appendChild(btn);
  box.appendChild(note);
  parent.appendChild(box);
}
var THREADS = {};
var THREAD_NAME = null;
var LASTDATA = null;
var ACTIVE_EP = null;

function refreshThread() {
  if (!token) return;
  fetch(SUPABASE_URL + "/rest/v1/rpc/customer_thread", {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (resp) {
    return resp.ok ? resp.json() : null;
  }).then(function (t) {
    if (!t) return;
    THREAD_NAME = t.customer_name;
    THREADS = {};
    (t.threads || []).forEach(function (th) {
      THREADS[th.episode_id] = th.sets || [];
    });
    if (LASTDATA) render(LASTDATA);
  }).catch(function () {});
}

function convoSet(set, customerName) {
  var wrap = el("div");
  var q = set.question || {};
  var qw = el("p", null, "cwho");
  qw.appendChild(el("b", customerName || "You"));
  qw.appendChild(document.createTextNode(
    " asked · " + (prettyDate(String(q.at || "").split("T")[0]) || "")));
  wrap.appendChild(qw);
  wrap.appendChild(el("p", q.text || "", "ctext"));
  var replies = set.replies || [];
  var shown = 0;
  replies.forEach(function (r) {
    if (r.source === "coco" && r.endorsed === false) return;
    shown++;
    var rw = el("p", null, "cwho");
    rw.appendChild(el("b", r.name || "The shop"));
    rw.appendChild(document.createTextNode(
      " · " + (prettyDate(String(r.at || "").split("T")[0]) || "")));
    if (r.source === "coco" && r.endorsed === true) {
      rw.appendChild(el("span", "✓ Omar agreed", "agree"));
    }
    wrap.appendChild(rw);
    wrap.appendChild(el("p", r.text || "", "ctext"));
  });
  if (shown === 0) {
    if (q.state === "resolved") {
      wrap.appendChild(el("p",
        "The shop answered this one directly.", "cwait"));
    } else {
      wrap.appendChild(el("p", "Waiting for Omar.", "cwait"));
    }
  }
  return wrap;
}

function convoSection(parent, entry) {
  var sets = THREADS[entry.episodeId];
  if (!sets || sets.length === 0) return;
  parent.appendChild(el("h2", "Conversation"));
  var preview = el("div");
  preview.appendChild(convoSet(sets[sets.length - 1], THREAD_NAME));
  parent.appendChild(preview);
  if (sets.length < 2) return;
  var full = el("div");
  full.style.display = "none";
  sets.forEach(function (s) { full.appendChild(convoSet(s, THREAD_NAME)); });
  var openBtn = el("button", "Press for full conversation", "convobtn");
  var closeBtn = el("button", "Close Conversation", "convobtn");
  closeBtn.style.display = "none";
  openBtn.addEventListener("click", function () {
    full.style.display = "block";
    preview.style.display = "none";
    openBtn.style.display = "none";
    closeBtn.style.display = "";
  });
  closeBtn.addEventListener("click", function () {
    full.style.display = "none";
    preview.style.display = "";
    openBtn.style.display = "";
    closeBtn.style.display = "none";
  });
  parent.appendChild(openBtn);
  parent.appendChild(full);
  parent.appendChild(closeBtn);
}
var OUTBOUND = {};

var RESPONSE_LABEL = {
  bought: "Bought it",
  not_now: "Not now",
  call_me: "Call me",
  yes: "Yes, I'll come in",
  acknowledged: "Got it"
};

function refreshOutbound() {
  fetch(SUPABASE_URL + "/rest/v1/rpc/customer_outbound", {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (resp) {
    return resp.ok ? resp.json() : null;
  }).then(function (data) {
    OUTBOUND = {};
    if (data && data.requests) {
      data.requests.forEach(function (r) {
        if (!OUTBOUND[r.episode_id]) OUTBOUND[r.episode_id] = [];
        OUTBOUND[r.episode_id].push(r);
      });
    }
    if (LASTDATA) render(LASTDATA);
  }).catch(function () {});
}
  
  function outboundSection(card, entry) {
  var list = OUTBOUND[entry.episodeId] || [];
  if (list.length === 0) return;
  card.appendChild(el("h2", "From the shop"));
  list.forEach(function (r) {
    var box = el("div");
    var p = r.payload || {};
    if (r.kind === "buy") {
      box.appendChild(el("p", "The shop asks you to buy this part:"));
      if (p.text) box.appendChild(el("p", p.text));
      if (p.link) {
        var lp = el("p", null, "rlink");
        if (/^https?:\/\//i.test(p.link)) {
          var a = el("a", "See the part");
          a.href = p.link;
          a.target = "_blank";
          a.rel = "noopener";
          lp.appendChild(a);
        } else {
          lp.textContent = p.link;
        }
        box.appendChild(lp);
      }
    } else {
      if (p.text) box.appendChild(el("p", p.text));
    }
    var row = el("div", null, "rrow");
    var note = el("p", "", "note");
    var defs = r.kind === "buy"
      ? [["bought", true], ["not_now", false], ["call_me", false]]
      : r.kind === "visit"
        ? [["yes", true], ["call_me", false]]
        : [["acknowledged", true]];
    var btns = [];
    defs.forEach(function (def) {
      var b = el("button", RESPONSE_LABEL[def[0]],
        def[1] ? "primary" : null);
      b.type = "button";
      b.addEventListener("click", function () {
        btns.forEach(function (x) { x.disabled = true; });
        note.textContent = "Sending...";
fetch(SUPABASE_URL + "/rest/v1/rpc/customer_respond", {
  method: "POST",
  headers: {
    "apikey": PUBLISHABLE_KEY,
    "Authorization": "Bearer " + PUBLISHABLE_KEY,
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    p_token: token,
    p_outbound_id: r.id,
    p_response: def[0]
  })
}).then(function (resp) {
  return resp.ok ? resp.json() : null;
}).then(function (ok) {
          if (ok === true) {
            box.innerHTML = "";
            box.appendChild(el("p",
              "You answered: " + RESPONSE_LABEL[def[0]], "rdone"));
               OUTBOUND[entry.episodeId] =
               (OUTBOUND[entry.episodeId] || [])
                .filter(function (x) { return x.id !== r.id; });
          } else {
            btns.forEach(function (x) { x.disabled = false; });
            note.textContent =
              "That did not go through. Please try again.";
          }
        });
      });
      btns.push(b);
      row.appendChild(b);
    });
    box.appendChild(row);
    box.appendChild(note);
    card.appendChild(box);
  });
}

function storySection(parent, story) {
  if (!story || story.length === 0) return;
  parent.appendChild(el("h2", "Story"));
  story.slice().reverse().forEach(function (e) {
    parent.appendChild(el("p", prettyDate(e.date) || e.date || "", "storydate"));
    parent.appendChild(el("p", e.text || "", "storytext"));
  });
}
  
function endingSection(card, s) {
  var e = s.ending || {};
  var box = el("div", null,
    "endbox" + (s.state === "paused" ? " paused" : ""));
  box.appendChild(el("p",
    s.state === "completed"
      ? "This job is complete." : "This job is paused."));
  var sub = "";
  if (s.state === "completed" && e.date) {
    sub = "Completed on " + (prettyDate(e.date) || e.date) + ".";
  } else if (s.state === "paused" && e.pickupDate) {
    sub = "Pickup date: " + (prettyDate(e.pickupDate) || e.pickupDate) + ".";
  }
  if (sub) box.appendChild(el("p", sub, "enddate"));
  card.appendChild(box);
}

function carCard(entry) {
  var s = entry.snapshot || {};
  var cs = s.currentStatus || {};
  var card = el("section", null, "card");
  card.appendChild(el("p", s.carName || "Your car", "car"));
  card.appendChild(el("p", s.episodeTitle || "", "job"));
  card.appendChild(el("p", cs.headline || "", "headline"));
  var date = prettyDate(s.blessedDoneDate);
  if (date) {
    var p = el("p", null, "eta");
    p.appendChild(document.createTextNode("Target completion: "));
    p.appendChild(el("b", date));
    card.appendChild(p);
  }
  var asof = prettyDate(s.asOf);
  card.appendChild(el("p", "Status as of " + (asof || "the last sign-off"), "asof"));

var ended = (s.state === "completed" || s.state === "paused");
if (ended) endingSection(card, s);
var open = ended ? [] : (cs.inProgress || []);
if (open.length > 0) {
    listSection(card, "In Progress", open.slice(0, 1));
    card.appendChild(el("h2", "Next Task"));
    if (open.length > 1) {
      var ul = el("ul");
      ul.appendChild(el("li", String(open[1])));
      card.appendChild(ul);
    } else {
      card.appendChild(el("p",
        "The car will be ready for you on completion of the task in progress and Omar signs off.",
        "nextlast"));
    }
  }
if (!ended) {
  outboundSection(card, entry);
  askSection(card, entry);
}
convoSection(card, entry);
if (!ended) listSection(card, "Waiting on", cs.waitingOn);
  var signed = (cs.signedOff || []).slice().reverse();
  listSection(card, "Signed off", signed);
  storySection(card, s.story);
  return card;
}
  
function render(data) {
  LASTDATA = data;
  app.innerHTML = "";
  app.appendChild(el("h1", "Your car's current status"));
  app.appendChild(el("p", "For " + data.customer, "sub"));
  var snaps = data.snapshots || [];
  if (snaps.length === 0) {
    app.appendChild(el("p", "No published status yet. Check back after the shop's next update.", "note"));
    return;
  }
  if (!ACTIVE_EP) ACTIVE_EP = snaps[0].episodeId;
  var holder = el("div");
  if (snaps.length > 1) {
    var bar = el("div", null, "switcher");
    snaps.forEach(function (entry) {
    var pillLabel = (entry.snapshot && entry.snapshot.carName) || "Car";
    if (entry.snapshot && entry.snapshot.episodeTitle) {
      pillLabel += " · " + entry.snapshot.episodeTitle; 
    }
    var b = el("button", pillLabel);
      if (entry.episodeId === ACTIVE_EP) b.className = "active";
      b.addEventListener("click", function () {
        ACTIVE_EP = entry.episodeId;
        render(LASTDATA);
      });
      bar.appendChild(b);
    });
    app.appendChild(bar);
  }
  var current = snaps[0];
  snaps.forEach(function (e) {
    if (e.episodeId === ACTIVE_EP) current = e;
  });
  holder.appendChild(carCard(current));
  app.appendChild(holder);
}

var token = new URLSearchParams(window.location.search).get("t");
if (!token) {
  messagePage("This link is missing its key. Ask the shop for a fresh link.");
} else {
  fetch(SUPABASE_URL + "/rest/v1/rpc/customer_snapshots", {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (resp) {
    if (!resp.ok) {
      messagePage("Something went wrong loading your status. Please try again in a little while.");
      return null;
    }
    return resp.json();
  }).then(function (data) {
    if (!data) return;
      if (data.customer == null) {
    messagePage("This link is no longer active. Ask the shop for a fresh link.");
    return;
  }
  render(data);
  refreshThread();
  refreshOutbound();
}).catch(function () {
   messagePage("Something went wrong loading your status. Please try again in a little while.");
  });
}
</script>
</body>
</html>
