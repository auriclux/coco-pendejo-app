(function () {
  try {
    var s = localStorage.getItem('oo_skin');
    if (!s) {
      var d = new Date();
      if (d.getMonth() === 11 && d.getDate() >= 23 && d.getDate() <= 26) s = 'navidad';

    if (s) document.documentElement.setAttribute('data-skin', s);

})();

  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 2px; }
  .count { color: var(--subtext); font-size: 14px; margin: 0 0 14px; }
  .card { background: var(--card-bg); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; box-shadow: 0 1px 3px var(--card-shadow); }
  .who { font-size: 17px; font-weight: 700; margin: 0; }
  .car { color: var(--dim); font-size: 14px; margin: 2px 0 0; }
  .wait { color: var(--danger); font-size: 13px; font-weight: 700; margin: 6px 0 0; }
  .qtext { font-size: 16px; margin: 10px 0 0; }
  .reply textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
  .reply button { margin-top: 8px; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-accent); font-weight: 600; cursor: pointer; }
  .reply button:disabled { opacity: 0.5; }
  .reply button.speak { background: var(--card-bg); color: var(--brand); margin-right: 8px; }
  .reply button.handled { background: var(--card-bg); color: var(--dim); border-color: var(--line); margin-left: 8px; }
  .note { color: var(--subtext); font-size: 14px; margin: 8px 0 0; }
  .banner { background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin: 0 0 14px; display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  .refresh { font-size: 14px; color: var(--brand); background: none; border: none; cursor: pointer; font-weight: 600; padding: 0; }
  .backline a { color: var(--brand); font-weight: 600; text-decoration: none; font-size: 15px; }

</head>
<body>
<main id="app">
<p class="backline"><a href="index.html">← Back to the board</a></p>
<div class="topbar">
    <h1>Customer Questions</h1>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>
  <p class="count" id="count"></p>
  <div class="banner" id="banner"></div>
  <div id="list"><p class="note">Loading...</p></div>
</main>
<script>
"use strict";

var SUPABASE_URL = "https://lnyfpelahepvwlfwppgj.supabase.co";
var PUBLISHABLE_KEY = "sb_publishable_yEcdzGdtwcZr4XJm5qSdrw_XDgtezjP";

function actorId() {
  var fromUrl = new URLSearchParams(window.location.search).get("a");
  if (fromUrl) {
    try { localStorage.setItem("oo_actor", fromUrl); } catch (e) {}
    return fromUrl;
  }
  try { return localStorage.getItem("oo_actor"); } catch (e) { return null; }
}

var ACTOR = actorId();

function el(tag, text, cls) {
  var n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

function rpc(name, body) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  }).then(function (resp) {
    return resp.ok ? resp.json() : null;
  }).catch(function () { return null; });
}

function waiting(created) {
  var mins = Math.floor((Date.now() - new Date(created).getTime()) / 60000);
  if (mins < 1) return "Just arrived";
  if (mins < 60) return "Waiting " + mins + (mins === 1 ? " minute" : " minutes");
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return "Waiting " + hrs + (hrs === 1 ? " hour" : " hours");
  var days = Math.floor(hrs / 24);
  return "Waiting " + days + (days === 1 ? " day" : " days");
}

function showBanner(text) {
  var b = document.getElementById("banner");
  b.textContent = text;
  b.style.display = "block";
}

function setCount(n) {
  document.getElementById("count").textContent =
    n === 0 ? "" : (n === 1 ? "1 waiting" : n + " waiting");
}

function questionCard(q) {
  var card = el("div", null, "card");
  card.appendChild(el("p", q.customer_name || "Customer", "who"));
  var carLine = q.car_name
    ? (q.job_title ? q.car_name + " · " + q.job_title : q.car_name)
    : "General question";
  card.appendChild(el("p", carLine, "car"));
  card.appendChild(el("p", waiting(q.created_at), "wait"));
  var pl = q.payload || {};
if (q.kind && q.kind.slice(-9) === "_response") {
  var labels = {
    bought: "Bought it", not_now: "Not now", call_me: "Call me",
    yes: "Yes, I'll come in", acknowledged: "Got it"
  };
  var heads = {
    buy_response: "Parts request answered",
    visit_response: "Come-in request answered",
    note_response: "Message acknowledged"
  };
  card.appendChild(el("p",
    (heads[q.kind] || "Request answered") + ": " +
    (labels[pl.response] || pl.response || ""),
    "qtext"));
  if (pl.text) {
    card.appendChild(el("p", "You asked: " + pl.text, "car"));
  }
  if (pl.link) {
    var lp2 = el("p", null, "car");
    var a2 = el("a", pl.link);
    if (/^https?:\/\//i.test(pl.link)) a2.href = pl.link;
    a2.target = "_blank";
    a2.rel = "noopener";
    lp2.appendChild(a2);
    card.appendChild(lp2);
  }
} else {
  var text = pl.text || pl.question || "";
  card.appendChild(el("p", text || "(message with no text)", "qtext"));
}
  var reply = el("div", null, "reply");
  var ta = el("textarea");
  ta.rows = 3;
  ta.placeholder = "Reply to " + (q.customer_name || "the customer") + "...";
  var send = el("button", "Send");
  var handled = el("button", "Handled another way", "handled");
  var note = el("p", "", "note");

  function setBusy(busy) {
    send.disabled = busy;
    handled.disabled = busy;
  }

  function resolve(replyText, doneText) {
    setBusy(true);
    note.textContent = "Sending...";
    rpc("shop_inbox_resolve", {
      p_actor_id: ACTOR,
      p_item_id: q.id,
      p_reply_text: replyText
    }).then(function (ok) {
      if (ok === true) {
        card.remove();
        showBanner(doneText);
        var list = document.getElementById("list");
        setCount(list.querySelectorAll(".card").length);
        if (!list.querySelector(".card")) {
          list.appendChild(el("p", "No unanswered questions.", "note"));
          setCount(0);
        }
      } else {
        setBusy(false);
        note.textContent =
          "That did not go through. It may already be answered. Try Refresh.";
      }
    });
  }

  send.addEventListener("click", function () {
    var text2 = ta.value.trim();
    if (!text2) {
      note.textContent =
        "Write or speak a reply first, or use Handled another way.";
      return;
    }
    resolve(text2, "Reply sent to " + (q.customer_name || "the customer") + ".");
  });

  handled.addEventListener("click", function () {
    resolve(null, "Marked handled for " + (q.customer_name || "the customer") + ".");
  });

  reply.appendChild(ta);
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = el("button", "🎤 Speak", "speak");
    var recog = new SR();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true;
    var listening = false;
    var baseText = "";
    mic.addEventListener("click", function () {
      if (listening) { recog.stop(); return; }
      baseText = ta.value.trim();
      if (baseText) baseText += " ";
      recog.start();
    });
    recog.addEventListener("start", function () {
      listening = true;
      mic.textContent = "⏹ Stop";
      note.textContent = "Listening... speak now.";
    });
    recog.addEventListener("result", function (ev) {
      var txt = "";
      for (var i = 0; i < ev.results.length; i++) {
        txt += ev.results[i][0].transcript;
      }
      ta.value = baseText + txt;
    });
    recog.addEventListener("end", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      if (note.textContent.indexOf("Listening") === 0) note.textContent = "";
    });
    recog.addEventListener("error", function () {
      listening = false;
      mic.textContent = "🎤 Speak";
      note.textContent = "The microphone did not work here. You can type instead.";
    });
    reply.appendChild(mic);
  }
  reply.appendChild(send);
  reply.appendChild(handled);
  reply.appendChild(note);
  card.appendChild(reply);
  return card;
}

function load() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  list.appendChild(el("p", "Loading...", "note"));
  rpc("shop_inbox_open", { p_actor_id: ACTOR }).then(function (data) {
    list.innerHTML = "";
    if (!data || !data.questions) {
      list.appendChild(el("p",
        "That shop key was not accepted. Open this page from the shop link.", "note"));
      setCount(0);
      return;
    }
    if (data.questions.length === 0) {
      list.appendChild(el("p", "No unanswered questions.", "note"));
      setCount(0);
      return;
    }
    setCount(data.questions.length);
    data.questions.forEach(function (q) {
      list.appendChild(questionCard(q));
    });
  });
}

document.getElementById("refreshBtn").addEventListener("click", load);

if (!ACTOR) {
  document.getElementById("list").innerHTML = "";
  document.getElementById("list").appendChild(el("p",
    "This page needs the shop link. Ask for the link with your key in it.", "note"));
} else {
  load();
}
</script>
</body>
