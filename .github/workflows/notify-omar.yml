name: Notify Omar on Production Deploy

on:
  push:
    branches:
      - main

jobs:
  send-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Send SMS alert to Omar via Twilio
        uses: twilio/actions-sms@v1
        with:
          account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
          auth_token: ${{ secrets.TWILIO_AUTH_TOKEN }}
          from: ${{ secrets.TWILIO_FROM_NUMBER }}
          to: ${{ secrets.OMAR_PHONE_NUMBER }}
          body: "🚨 Coco here! Oye, just updated the Double-O Garage app. Ve a checarlo real quick when you get a chance!"
