name: Notify Omar on Production Deploy

on:
  push:
    branches: [ main ]

jobs:
  send-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Send Twilio SMS to Omar
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          OMAR_PHONE_NUMBER: ${{ secrets.OMAR_PHONE_NUMBER }}
        run: |
          curl -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
          --data-urlencode "To=$OMAR_PHONE_NUMBER" \
          --data-urlencode "From=$TWILIO_FROM_NUMBER" \
          --data-urlencode "Body=🚨 Double-O Garage: Main branch updated successfully!" \
          -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN"
