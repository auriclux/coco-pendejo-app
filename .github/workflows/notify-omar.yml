name: Notify Omar on Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  send-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Send Twilio SMS to Recipients
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: |
          RECIPIENTS=("+13108978019" "+13109469899")
          for PHONE in "${RECIPIENTS[@]}"; do
            curl -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
              --data-urlencode "To=$PHONE" \
              --data-urlencode "From=$TWILIO_FROM_NUMBER" \
              --data-urlencode "Body=🚨 Coco here! Oye, just updated the Double-O Garage app. Ve a checarlo real quick when you get a chance!" \
              -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN"
          done
