<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coco Pendejo - Shop Board</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #00e676;
      --warn: #ff9100;
      --danger: #ff1744;
      --subtext: #aaaaaa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #sync-banner {
      display: none;
      background-color: var(--danger);
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header {
      margin-bottom: 16px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    p.sub { margin: 4px 0 0; color: var(--subtext); font-size: 0.85rem; }

    /* New Car Input Bar */
    .add-car-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .add-car-input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 1rem;
    }
    .add-car-input:focus { outline: none; border-color: var(--accent); }
    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Project Cards */
    .project-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2a2a2a;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .project-title { font-size: 1.25rem; font-weight: bold; }
    .btn-delete-card {
      background: transparent;
      border: none;
      color: #666;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .btn-delete-card:hover { color: var(--danger); }

    /* Status Selector Buttons */
    .status-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-status {
      flex: 1;
      padding: 12px 6px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #888;
      background: #2a2a2a;
      cursor: pointer;
    }
    .btn-status.active-active { background: var(--accent); color: #000; }
    .btn-status.active-parts { background: var(--warn); color: #000; }
    .btn-status.active-done { background: #444; color: #fff; }

    /* Task Sub-Section */
    .task-section {
      border-top: 1px dashed #333;
      padding-top: 12px;
    }
    .task-title { font-size: 0.9rem; color: var(--subtext); margin-bottom: 8px; font-weight: bold; }
    .task-list { list-style: none; padding: 0; margin: 0 0 10px 0; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 0.95rem;
    }
    .task-item.completed { text-decoration: line-through; color: #666; }
    .task-checkbox { width: 18px; height: 18px; accent-color: var(--accent); }
    .btn-delete-task {
      margin-left: auto;
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
    }
    
    .add-task-container { display: flex; gap: 6px; }
    .add-task-input {
      flex: 1;
      background: #121212;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      color: white;
      font-size: 0.85rem;
    }
    .btn-add-task {
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="sync-banner">⚠️ LOST SYNC - DISPLAYING CACHED DATA</div>

  <header>
    <h1>Double-O Shop Board</h1>
    <p class="sub">Tap status to update • Phone Prototype v0.2</p>
  </header>

  <!-- Add New Car Form -->
  <div class="add-car-container">
    <input type="text" id="new-car-name" class="add-car-input" placeholder="Add car (e.g. '51 Chevy Pickup)...">
    <button class="btn-add" onclick="addCar()">+ Add</button>
  </div>

  <main id="app-container"></main>

  <script>
    // Hybrid Offline Banner Handling
    function updateOnlineStatus() {
      const banner = document.getElementById('sync-banner');
      banner.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Default seed data if local memory is empty
    const defaultData = [
      {
        id: 1,
        title: "'51 Chevy Pickup",
        status: "Active",
        tasks: [
          { text: "Airbag bracket fabrication", done: false },
          { text: "Route airline system", done: true }
        ]
      },
      {
        id: 2,
        title: "'57 Bel Air",
        status: "Parts",
        tasks: [
          { text: "Waiting on front disc conversion kit", done: false }
        ]
      }
    ];

    // Load initial data from localStorage or fallback to seed
    let projects = JSON.parse(localStorage.getItem('cp_projects')) || defaultData;

    function saveAndRender() {
      localStorage.setItem('cp_projects', JSON.stringify(projects));
      renderProjects();
    }

    function addCar() {
      const input = document.getElementById('new-car-name');
      const name = input.value.trim();
      if (!name) return;

      projects.unshift({
        id: Date.now(),
        title: name,
        status: 'Active',
        tasks: []
      });

      input.value = '';
      saveAndRender();
    }

    function deleteCar(id) {
      projects = projects.filter(p => p.id !== id);
      saveAndRender();
    }

    function updateStatus(id, status) {
      const project = projects.find(p => p.id === id);
      if (project) {
        project.status = status;
        saveAndRender();
      }
    }

    function addTask(id) {
      const input = document.getElementById(`task-input-${id}`);
      const text = input.value.trim();
      if (!text) return;

      const project = projects.find(p => p.id === id);
      if (project) {
        project.tasks.push({ text, done: false });
        input.value = '';
        saveAndRender();
      }
    }

    function toggleTask(projId, taskIdx) {
      const project = projects.find(p => p.id === projId);
      if (project && project.tasks[taskIdx]) {
        project.tasks[taskIdx].done = !project.tasks[taskIdx].done;
        saveAndRender();
      }
    }

    function deleteTask(projId, taskIdx) {
      const project = projects.find(p => p.id === projId);
      if (project) {
        project.tasks.splice(taskIdx, 1);
        saveAndRender();
      }
    }

    function renderProjects() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';

        card.innerHTML = `
          <div class="card-header">
            <div class="project-title">${p.title}</div>
            <button class="btn-delete-card" onclick="deleteCar(${p.id})">✕</button>
          </div>

          <div class="status-group">
            <button class="btn-status ${p.status === 'Active' ? 'active-active' : ''}" onclick="updateStatus(${p.id}, 'Active')">In Progress</button>
            <button class="btn-status ${p.status === 'Parts' ? 'active-parts' : ''}" onclick="updateStatus(${p.id}, 'Parts')">Waiting Parts</button>
            <button class="btn-status ${p.status === 'Done' ? 'active-done' : ''}" onclick="updateStatus(${p.id}, 'Done')">Done</button>
          </div>

          <div class="task-section">
            <div class="task-title">Tasks (${p.tasks.filter(t => t.done).length}/${p.tasks.length})</div>
            <ul class="task-list">
              ${p.tasks.map((t, idx) => `
                <li class="task-item ${t.done ? 'completed' : ''}">
                  <input type="checkbox" class="task-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${p.id}, ${idx})">
                  <span>${t.text}</span>
                  <button class="btn-delete-task" onclick="deleteTask(${p.id}, ${idx})">✕</button>
                </li>
              `).join('')}
            </ul>
            <div class="add-task-container">
              <input type="text" id="task-input-${p.id}" class="add-task-input" placeholder="Add task...">
              <button class="btn-add-task" onclick="addTask(${p.id})">+ Task</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Initial Render
    renderProjects();
  </script>
<!-- Voice Feedback Bar (Place at the bottom of index.html body) -->
<div id="feedback-bar" style="position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 12px; border-top: 2px solid #e74c3c; text-align: center; z-index: 1000;">
  <button id="btn-tell-scot" onclick="openFeedbackModal()" style="background: #e74c3c; color: #fff; border: none; padding: 14px 20px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    🎤 TELL SCOT WHAT YOU THINK
  </button>
</div>

<!-- Voice Feedback Modal Overlay -->
<div id="feedback-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1001; padding: 20px; box-sizing: border-box; justify-content: center; align-items: center;">
  <div style="background: #2b2b2b; color: #fff; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; text-align: center; border: 1px solid #444;">
    <h3 style="margin-top: 0; color: #f39c12;">Coco is Listening...</h3>
    <p id="feedback-status" style="font-size: 0.9rem; color: #aaa;">"Press then speak to tell me what you think."</p>

    <!-- Transcribed Text Container -->
    <textarea id="feedback-transcript" rows="5" style="width: 100%; background: #111; color: #2ecc71; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px;" placeholder="Spoken feedback will appear here..."></textarea>

    <div style="display: flex; gap: 10px; justify-content: center;">
      <button onclick="saveFeedback()" style="background: #2ecc71; color: #000; border: none; padding: 12px 20px; font-weight: bold; font-size: 1rem; border-radius: 6px; flex: 1;">
        ✅ DONE / SEND
      </button>
      <button onclick="closeFeedbackModal()" style="background: #7f8c8d; color: #fff; border: none; padding: 12px 15px; font-size: 1rem; border-radius: 6px;">
        CANCEL
      </button>
    </div>
  </div>
</div>

<script>
let recognition = null;

// Speech Synthesis: Audio Prompt ("Press then speak to tell me what you think")
function speakPrompt(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

function openFeedbackModal() {
  document.getElementById('feedback-modal').style.display = 'flex';
  document.getElementById('feedback-transcript').value = '';
  
  // Play the audio invitation
  speakPrompt("Press then speak to tell me what you think.");
  
  startSpeechRecognition();
}

function closeFeedbackModal() {
  if (recognition) recognition.stop();
  document.getElementById('feedback-modal').style.display = 'none';
}

function startSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('feedback-status').innerText = "Web Speech API not supported on this browser.";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    document.getElementById('feedback-status').innerText = "🔴 Listening... Speak clearly.";
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('feedback-transcript').value = transcript;
  };

  recognition.onerror = (event) => {
    console.error("Speech Error:", event.error);
    document.getElementById('feedback-status').innerText = "Speech recognition error: " + event.error;
  };

  recognition.start();
}

function saveFeedback() {
  const text = document.getElementById('feedback-transcript').value.trim();
  if (!text) {
    closeFeedbackModal();
    return;
  }

  // Store in LocalStorage under 'coco_feedback_log'
  const existingLog = JSON.parse(localStorage.getItem('coco_feedback_log') || '[]');
  existingLog.push({
    timestamp: new Date().toISOString(),
    feedback: text
  });
  localStorage.setItem('coco_feedback_log', JSON.stringify(existingLog));

  if (recognition) recognition.stop();
  document.getElementById('feedback-modal').style.display = 'none';
  alert("Feedback saved! Scot will see this on the next update check.");
}
</script>
</body>
</html>
