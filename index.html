<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coco Pendejo - Shop Board</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #00e676;
      --warn: #ff9100;
      --danger: #ff1744;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #sync-banner {
      display: none;
      background-color: var(--danger);
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    header {
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    p.sub { margin: 4px 0 0; color: #888; font-size: 0.85rem; }
    
    .project-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2a2a2a;
    }
    .project-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; }
    .status-group { display: flex; gap: 8px; margin-top: 12px; }
    
    .btn-status {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #888;
      background: #2a2a2a;
      cursor: pointer;
    }
    .btn-status.active-active { background: var(--accent); color: #000; }
    .btn-status.active-parts { background: var(--warn); color: #000; }
    .btn-status.active-done { background: #444; color: #fff; }
  </style>
</head>
<body>

  <div id="sync-banner">⚠️ LOST SYNC - DISPLAYING CACHED DATA</div>

  <header>
    <h1>Double-O Shop Board</h1>
    <p class="sub">Tap status to update • Phone Prototype v0.1</p>
  </header>

  <main id="app">
    <!-- Card 1 -->
    <div class="project-card" data-id="1">
      <div class="project-title">'51 Chevy Pickup</div>
      <div class="status-group">
        <button class="btn-status active-active" onclick="setStatus(this, 'Active')">In Progress</button>
        <button class="btn-status" onclick="setStatus(this, 'Parts')">Waiting Parts</button>
        <button class="btn-status" onclick="setStatus(this, 'Done')">Done</button>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="project-card" data-id="2">
      <div class="project-title">'57 Bel Air</div>
      <div class="status-group">
        <button class="btn-status" onclick="setStatus(this, 'Active')">In Progress</button>
        <button class="btn-status active-parts" onclick="setStatus(this, 'Parts')">Waiting Parts</button>
        <button class="btn-status" onclick="setStatus(this, 'Done')">Done</button>
      </div>
    </div>
  </main>

  <script>
    // Hybrid Offline Banner Handling
    function updateOnlineStatus() {
      const banner = document.getElementById('sync-banner');
      if (navigator.onLine) {
        banner.style.display = 'none';
      } else {
        banner.style.display = 'block';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    updateOnlineStatus();

    // Toggle Status Buttons
    function setStatus(btn, state) {
      const group = btn.parentElement;
      const buttons = group.querySelectorAll('.btn-status');
      
      buttons.forEach(b => {
        b.className = 'btn-status';
      });

      if (state === 'Active') btn.classList.add('active-active');
      if (state === 'Parts') btn.classList.add('active-parts');
      if (state === 'Done') btn.classList.add('active-done');

      const card = btn.closest('.project-card');
      const id = card.getAttribute('data-id');
      localStorage.setItem(`project_status_${id}`, state);
    }
  </script>
</body>
</html>
