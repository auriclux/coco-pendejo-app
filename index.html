<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coco la Chaneque - Double-O Garage Shop Board</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #00e676;
      --danger-color: #ff5252;
      --border-color: #333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-danger {
      background-color: rgba(255, 82, 82, 0.15);
      color: var(--danger-color);
      border-color: var(--danger-color);
    }

    .btn-danger:hover {
      background-color: var(--danger-color);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #333;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    .card-body {
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #2a2a2a;
      padding-top: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Double-O Shop Board</h1>
    <button class="btn" onclick="resetDefaultProjects()">Reset Defaults</button>
  </header>

  <main id="projectGrid" class="grid">
    <!-- Project cards render dynamically here -->
  </main>

  <script>
    const defaultProjects = [
      { id: "p1", name: "ScapeGoat", description: "1968 Pontiac GTO Street/Strip", status: "Active" },
      { id: "p2", name: "Not for Higher", description: "1952 GMC COE Crew Cab on RAM 5500", status: "In Progress" },
      { id: "p3", name: "Reiver, The Corner Thief", description: "1962 Mini 850 AWD LS-VTEC", status: "Staging" },
      { id: "p4", name: "Midnight Caprice", description: "1974 Caprice Classic Twin-Turbo LS3", status: "Planning" },
      { id: "p5", name: "VôôDôô Chīle", description: "1948 Studebaker Supercharged Voodoo", status: "Bodywork" },
      { id: "p6", name: "BIG MACK", description: "Miniature Mack F700 on Acty HA6 TDI", status: "Chassis" }
    ];

    function getProjects() {
      const stored = localStorage.getItem("coco_projects");
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch (e) {
          console.error("Failed to parse stored projects", e);
        }
      }
      return defaultProjects;
    }

    function saveProjects(projects) {
      localStorage.setItem("coco_projects", JSON.stringify(projects));
    }

    function renderProjects() {
      const grid = document.getElementById("projectGrid");
      const projects = getProjects();

      if (projects.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <p>No active project builds on the board.</p>
            <button class="btn" onclick="resetDefaultProjects()">Reload Default Builds</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = projects.map(p => `
        <div class="card" id="card-${p.id}">
          <div>
            <div class="card-header">
              <h2 class="card-title">${escapeHtml(p.name)}</h2>
              <span class="status-badge">${escapeHtml(p.status || 'Active')}</span>
            </div>
            <div class="card-body">
              <p>${escapeHtml(p.description || '')}</p>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn btn-danger" onclick="deleteProject('${p.id}')">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    function deleteProject(id) {
      let projects = getProjects();
      const target = projects.find(p => p.id === id);
      const name = target ? target.name : "this project";

      if (confirm(`Remove "${name}" from the shop board?`)) {
        projects = projects.filter(p => p.id !== id);
        saveProjects(projects);
        renderProjects();
      }
    }

    function resetDefaultProjects() {
      if (confirm("Reset the shop board back to default builds?")) {
        saveProjects(defaultProjects);
        renderProjects();
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    document.addEventListener("DOMContentLoaded", renderProjects);
  </script>
</body>
</html>
